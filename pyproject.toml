[project]
name = "gridpulse"
version = "0.1.0"
description = "GridPulse — weather-aware energy demand forecasting and grid intelligence platform"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["data", "models", "simulation", "personas", "components", "config"]

[tool.ruff.lint.per-file-ignores]
# Color science is written in the notation of its own field: CIE L*a*b* and
# OKLCh spell lightness/chroma/hue as L, C, H, and CIEDE2000's published
# formula uses L1/a1/b1, C1p, dLp, Sl/Sc/Sh. Renaming those to snake_case
# would make the implementation harder to check against the paper it comes
# from, which is the only way anyone can audit it.
"scripts/color_science.py" = ["N803", "N806", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks integration tests",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["data", "models", "simulation", "personas"]
omit = ["tests/*", "app.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
