<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — GridPulse</title>

  <!-- A 404 must never be indexed, and must never be presented as a page
       that exists. This is the one public surface with no canonical tag. -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0a0a0b">

  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="mask-icon" href="/assets/favicon.svg" color="#3b82f6">

  <style>
    /* Design tokens — curated subset of assets/custom.css :root, duplicated
       deliberately (the landing-page precedent): a public surface must not
       break when dashboard chrome CSS changes. Keep in sync by value.
       No webfont link here on purpose — a 404 should not block on a
       third-party font fetch to render three lines of text. */
    :root {
      --bg-base: #0a0a0b;
      --bg-raised: #111113;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text-primary: #e4e4e7;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --accent-base: #3b82f6;
      --accent-hover: #5b9aff;
      --font-sans: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-display: 'Sora', 'Inter', sans-serif;
      --radius-lg: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main { max-width: 34rem; text-align: center; }

    .code {
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin: 0 0 12px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      line-height: 1.25;
      margin: 0 0 12px;
      color: var(--text-primary);
    }

    p { color: var(--text-secondary); margin: 0 0 28px; font-size: 15px; }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
    }

    nav a {
      display: inline-block;
      padding: 9px 16px;
      border-radius: var(--radius-lg);
      background: var(--bg-raised);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover { border-color: var(--accent-base); color: var(--accent-hover); }

    /* --accent-ring is 30% alpha; as an outline it measures ~1.5:1 against
       both surfaces, under the 3:1 WCAG 1.4.11 requires of a focus
       indicator. The opaque accent is what the dashboard and /about use. */
    a:focus-visible {
      outline: 2px solid var(--accent-base);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>That page isn&rsquo;t here.</h1>
    <p>
      The link may be out of date, or the address may have a typo. Everything
      GridPulse publishes is reachable from one of these:
    </p>
    <nav aria-label="Site">
      <a href="/">Live platform</a>
      <a href="/about">About GridPulse</a>
      <a href="/benchmark">Forecast benchmark</a>
    </nav>
  </main>
</body>
</html>
