name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Supersede in-flight runs for the SAME pull request only. Two runs 10s apart
# on one branch used to run the full ~9 minutes each.
#
# The group deliberately includes the SHA on push, which makes every push its
# own group and so never cancels. `deploy-prod.yml` consumes this workflow's
# conclusion via `workflow_run`, and `deploy-prod.yml` documents a real
# 2026-08-05 incident where cancel-in-progress shipped an older commit because
# cancellation follows workflow start order, not commit order. Cancelling a
# push-triggered CI run on main would resurface exactly that.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No hardcoded secrets
        run: |
          PATTERNS='AIza|sk-[a-zA-Z0-9]{20,}|AKIA|ghp_|API_KEY=["\x27]?[a-zA-Z0-9]{20,}'
          MATCHES=$(grep -rEn "$PATTERNS" --include="*.py" --include="*.yml" --include="*.yaml" \
            --exclude-dir=tests --exclude-dir=.github --exclude-dir=.venv . || true)
          if [ -n "$MATCHES" ]; then
            echo "FAIL: Possible hardcoded secrets detected:"
            echo "$MATCHES"
            exit 1
          fi
      - name: Ensure .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "FAIL: .env is tracked in git — remove with git rm --cached .env"
            exit 1
          fi
      - name: Check .env.example has placeholders
        run: |
          grep -q "your_" .env.example || (echo "FAIL: .env.example missing placeholders" && exit 1)

  # No `needs:` anywhere in this file. The four jobs are independent checks,
  # and chaining them made the critical path their SUM (~8m45s) rather than
  # their MAX. docker in particular waited ~7 minutes to discover the image
  # does not build. Runner minutes are free on this public repo, so there is
  # no cost argument for the chain. The deploy gate is unaffected:
  # deploy-prod.yml keys on the whole-workflow conclusion, which still
  # requires every job to pass.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Install the ruff version this repo actually pins (requirements.lock)
      # rather than whatever is newest. An unpinned linter silently upgrades
      # and fails unrelated PRs on rules that did not exist when the code was
      # written — which is exactly what happened on 2026-07-27, when a new
      # ruff began formatting fenced code blocks inside Markdown and started
      # rejecting CLAUDE.md content untouched since the initial commit.
      # Deriving the pin from the lock keeps CI and local development on the
      # same tool; upgrading ruff is now a deliberate lockfile change.
      - run: pip install "$(grep -m1 '^ruff==' requirements.lock)" mypy
      - run: ruff --version
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    # The coverage comment action writes a badge to an orphan data branch and
    # posts/updates a single PR comment.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Full history: diff-cover needs the merge-base with the target branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache the BUILT venv, not the wheel downloads. `cache: pip` (which
      # this replaces) only saved the download; the ~46s was unpacking
      # scipy/xgboost/shap/prophet. Keyed on requirements.txt, so the install
      # re-runs exactly when dependencies change and not otherwise.
      - name: Cache virtualenv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      # Every later step calls pytest / diff-cover / coverage bare, so the
      # venv has to lead PATH. The venv is created at a fixed workspace path,
      # which is stable across runs, so its shebangs stay valid when restored.
      - name: Activate venv
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Confirm the toolchain came from the venv
        run: |
          echo "python: $(which python)"
          echo "pytest: $(which pytest)"
          python -c "import sys; assert '.venv' in sys.prefix, sys.prefix"

      # ONE instrumented run over the whole pyramid. This used to be four steps
      # — unit, integration, smoke, then the entire suite AGAIN for coverage —
      # which ran every test twice for no added signal. pytest's own output
      # still names the failing layer, and single-process full-suite execution
      # was already proven green: the old "Coverage Report" step did exactly
      # this.
      #
      # `--cov-fail-under=0` overrides the `fail_under` in pyproject.toml ON
      # THIS STEP ONLY. Without it pytest-cov applies the threshold itself, so
      # a coverage shortfall would surface as a *test* failure and abort the
      # job before any report is published. The threshold is enforced by the
      # gate step at the end instead, once the artifacts and PR comment exist.
      - name: Tests + coverage
        run: |
          pytest tests/ --tb=short -n auto \
            --cov=data --cov=models --cov=simulation --cov=personas --cov=components \
            --cov-report=term-missing --cov-report=xml --cov-report=html \
            --cov-fail-under=0 \
            --junitxml=junit.xml

      # The line-level artifact: every source file rendered with covered and
      # uncovered lines highlighted. Uploaded even when the suite fails, which
      # is when it is most useful.
      - name: Upload coverage + test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            htmlcov/
            coverage.xml
            junit.xml
          retention-days: 14

      # Total coverage barely moves when 40 lines land in a 12,500-line
      # codebase, so it is the wrong instrument for reviewing a PR. This is the
      # one that matters: are the lines THIS PR touched actually executed?
      # Advisory (--fail-under=0) until the real distribution is known.
      - name: Changed-lines coverage
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --html-report diff-cover.html \
            --markdown-report diff-cover.md \
            --fail-under=0
          {
            echo '## Changed-lines coverage'
            echo
            cat diff-cover.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload changed-lines report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: diff-coverage
          path: diff-cover.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Coverage PR comment
        if: always()
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 85
          MINIMUM_ORANGE: 70

      # The gate itself, last, so the reports above always publish first.
      - name: Coverage gate
        run: coverage report --fail-under=70

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain `docker build`, deliberately. buildx with `cache-to:
      # type=gha,mode=max` was tried and measured on 2026-08-18: it took the
      # build from 83s to **371s**. mode=max exports every intermediate layer,
      # and for an image carrying prophet/xgboost/shap/scipy that export costs
      # far more than the install it was meant to skip. The job is also no
      # longer on the critical path now that it runs in parallel with `test`
      # (~1m50s against test's ~4m30s), so there is nothing here worth buying.
      - name: Build Docker image
        run: docker build -t gridpulse:ci .
      - name: Start container
        run: docker run -d -p 8080:8080 --name gp-test -e PRECOMPUTE_ENABLED=false gridpulse:ci
      # Poll rather than `sleep 15`. A fixed sleep is both slower than it
      # needs to be and flaky when the container is slow to bind.
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /tmp/health.json; then
              python3 -c "import sys,json; d=json.load(open('/tmp/health.json')); assert d['status']=='healthy', d"
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: container did not become healthy within 30s"
          docker logs gp-test
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f gp-test || true
