name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No hardcoded secrets
        run: |
          PATTERNS='AIza|sk-[a-zA-Z0-9]{20,}|AKIA|ghp_|API_KEY=["\x27]?[a-zA-Z0-9]{20,}'
          MATCHES=$(grep -rEn "$PATTERNS" --include="*.py" --include="*.yml" --include="*.yaml" \
            --exclude-dir=tests --exclude-dir=.github --exclude-dir=.venv . || true)
          if [ -n "$MATCHES" ]; then
            echo "FAIL: Possible hardcoded secrets detected:"
            echo "$MATCHES"
            exit 1
          fi
      - name: Ensure .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "FAIL: .env is tracked in git — remove with git rm --cached .env"
            exit 1
          fi
      - name: Check .env.example has placeholders
        run: |
          grep -q "your_" .env.example || (echo "FAIL: .env.example missing placeholders" && exit 1)

  lint:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Install the ruff version this repo actually pins (requirements.lock)
      # rather than whatever is newest. An unpinned linter silently upgrades
      # and fails unrelated PRs on rules that did not exist when the code was
      # written — which is exactly what happened on 2026-07-27, when a new
      # ruff began formatting fenced code blocks inside Markdown and started
      # rejecting CLAUDE.md content untouched since the initial commit.
      # Deriving the pin from the lock keeps CI and local development on the
      # same tool; upgrading ruff is now a deliberate lockfile change.
      - run: pip install "$(grep -m1 '^ruff==' requirements.lock)" mypy
      - run: ruff --version
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: [lint, security]
    # The coverage comment action writes a badge to an orphan data branch and
    # posts/updates a single PR comment.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Full history: diff-cover needs the merge-base with the target branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      # ONE instrumented run over the whole pyramid. This used to be four steps
      # — unit, integration, smoke, then the entire suite AGAIN for coverage —
      # which ran every test twice for no added signal. pytest's own output
      # still names the failing layer, and single-process full-suite execution
      # was already proven green: the old "Coverage Report" step did exactly
      # this.
      #
      # `--cov-fail-under=0` overrides the `fail_under` in pyproject.toml ON
      # THIS STEP ONLY. Without it pytest-cov applies the threshold itself, so
      # a coverage shortfall would surface as a *test* failure and abort the
      # job before any report is published. The threshold is enforced by the
      # gate step at the end instead, once the artifacts and PR comment exist.
      - name: Tests + coverage
        run: |
          pytest tests/ --tb=short \
            --cov=data --cov=models --cov=simulation --cov=personas --cov=components \
            --cov-report=term-missing --cov-report=xml --cov-report=html \
            --cov-fail-under=0 \
            --junitxml=junit.xml

      # The line-level artifact: every source file rendered with covered and
      # uncovered lines highlighted. Uploaded even when the suite fails, which
      # is when it is most useful.
      - name: Upload coverage + test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            htmlcov/
            coverage.xml
            junit.xml
          retention-days: 14

      # Total coverage barely moves when 40 lines land in a 12,500-line
      # codebase, so it is the wrong instrument for reviewing a PR. This is the
      # one that matters: are the lines THIS PR touched actually executed?
      # Advisory (--fail-under=0) until the real distribution is known.
      - name: Changed-lines coverage
        if: github.event_name == 'pull_request'
        run: |
          pip install diff-cover
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --html-report diff-cover.html \
            --markdown-report diff-cover.md \
            --fail-under=0
          {
            echo '## Changed-lines coverage'
            echo
            cat diff-cover.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload changed-lines report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: diff-coverage
          path: diff-cover.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Coverage PR comment
        if: always()
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 85
          MINIMUM_ORANGE: 70

      # The gate itself, last, so the reports above always publish first.
      - name: Coverage gate
        run: coverage report --fail-under=70

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t gridpulse:ci .
      - name: Start container
        run: |
          docker run -d -p 8080:8080 --name gp-test -e PRECOMPUTE_ENABLED=false gridpulse:ci
          sleep 15
      - name: Health check
        run: |
          curl -sf http://localhost:8080/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='healthy'"
      - name: Cleanup
        if: always()
        run: docker rm -f gp-test || true
