name: Deploy -> Production

# Gated behind CI (PR-G2 / #146): this workflow only runs after the "CI"
# workflow completes on main. The job-level ``if`` below requires CI to
# have *succeeded* — ``workflow_run`` fires on completion regardless of
# outcome, so the guard is what actually blocks a broken commit from
# deploying. Previously this triggered on every push to main independent
# of CI, so a red build could ship to production.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  PROJECT_ID: nextera-portfolio
  REGION: us-east1
  SERVICE: gridpulse
  REPO: portfolio
  IMAGE: us-east1-docker.pkg.dev/nextera-portfolio/portfolio/gridpulse
  # Race-free deploy target: the exact commit CI validated, NOT main's
  # current HEAD. Under ``workflow_run`` a newer commit may have landed
  # on main between CI passing and this workflow starting; deploying
  # ``github.sha`` (main HEAD) would ship un-validated code. Pin to the
  # SHA the triggering CI run actually tested.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Build & Deploy to Cloud Run (Production)
    runs-on: ubuntu-latest
    # Only deploy when the triggering CI run SUCCEEDED. ``workflow_run``
    # delivers failed + cancelled runs too; without this guard a red CI
    # would still deploy.
    if: github.event.workflow_run.conclusion == 'success'
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact commit CI validated (see DEPLOY_SHA note).
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }} \
            -t ${{ env.IMAGE }}:prod-latest \
            .
          docker push ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
          docker push ${{ env.IMAGE }}:prod-latest

      - name: Deploy to Cloud Run (Production)
        run: |
          # SIZING, MEASURED 2026-08-05. Was 2 vCPU / 4Gi. Over 7 days this
          # service took 3,741 requests/day (0.043 req/s) at CPU utilization
          # mean 0.001 / peak 0.12 of 2 vCPU, and memory mean 0.087 / peak 0.13
          # of 4Gi — a peak working set of ~0.24 vCPU and ~532 MB. 1 vCPU / 2Gi
          # still leaves ~4x headroom on both. Source: Cloud Monitoring
          # container/{cpu,memory}/utilizations, 3-day window.
          #
          # Why this was the largest line item on the bill: --min-instances 1
          # with --no-cpu-throttling bills the FULL instance at the always-
          # allocated rate for every second it exists, not just during requests.
          # container/billable_instance_time read 86,582 instance-s/day —
          # exactly 1.00 instance pinned on 24/7. At 2 vCPU / 4Gi that is
          # ~$114/mo to serve 0.04 req/s; at 1 vCPU / 2Gi it is ~$57/mo.
          #
          # --min-instances 1 and --cpu-boost STAY. This is a public portfolio
          # surface and a cold start on a Prophet/cmdstan/XGBoost image is tens
          # of seconds — the wrong trade for ~$57/mo. Do not "fix" the remaining
          # idle cost by scaling to zero without measuring that cold start.
          #
          # --cpu-throttling, set EXPLICITLY (2026-08-05). This tier does no
          # work between requests: the only background thread (app.py:193) is
          # gated behind PRECOMPUTE_ENABLED, which is false here and is a
          # dev-only scoring trigger. The web tier is read-only against Redis
          # by the CLAUDE.md I/O guardrail, so there is nothing to keep warm.
          # Throttling moves the service to request-based billing, where an
          # idle min-instance bills at the reduced idle rate instead of the
          # full always-allocated rate.
          #
          # IT MUST BE THE POSITIVE FLAG, NOT THE ABSENCE OF THE NEGATIVE ONE.
          # This bit us the same day: the first attempt merely DELETED
          # `--no-cpu-throttling` from this command, CI deployed green, and
          # revision gridpulse-00391-npb came up still carrying
          # `run.googleapis.com/cpu-throttling: 'false'`. `gcloud run deploy`
          # MERGES with the live revision — an omitted flag inherits, it does
          # not reset. The resize beside it landed (1 vCPU / 2Gi) which made
          # the deploy look like it had worked. Every sticky Cloud Run setting
          # behaves this way; assert the state you want, never the absence of
          # the state you don't. Verify with:
          #   gcloud run revisions describe $(gcloud run services describe \
          #     gridpulse --region us-east1 \
          #     --format='value(status.latestReadyRevisionName)') \
          #     --region us-east1 \
          #     --format='value(metadata.annotations."run.googleapis.com/cpu-throttling")'
          # It must read `true`.
          # The saving is EXPECTED BUT NOT YET MEASURED — unlike the resize
          # above, which is arithmetic. Settle it against the BigQuery billing
          # export (dataset nextera-portfolio:billing_export) once it has a full
          # day of Detailed-usage rows, and record the number in
          # docs/CANONICAL_FACTS.md rather than leaving this comment as the
          # source of truth.
          #
          # Cost/DoS ceiling note (#253): --max-instances 4 is the effective
          # spend cap on this --allow-unauthenticated service (~$228/mo pinned
          # at max vs ~$57 idle, both restated for the sizing above). The
          # web-tier guard backstops it: per-IP rate
          # limiting (API_RATE_LIMIT_PER_MIN / DASH_RATE_LIMIT_PER_MIN, with
          # RATE_LIMIT_EXEMPT_IPS for trusted shared-NAT egress), a pinned-at-max
          # alert, and a billing budget (docs/monitoring/). METRICS_ALLOWED_IPS
          # gates detailed /health + /metrics; unset here → deny-by-default.
          # NOTE: --set-env-vars uses the "^@^" custom delimiter (not the default
          # comma) because METRICS_ALLOWED_IPS is a comma-separated IP/CIDR list
          # — a comma in a value collides with the default delimiter and fails
          # the deploy ("Bad syntax for dict arg"). Do not revert to commas.
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 1 \
            --timeout 300 \
            --min-instances 1 \
            --max-instances 4 \
            --cpu-boost \
            --cpu-throttling \
            --vpc-connector wattcast-connector \
            --set-secrets "EIA_API_KEY=eia-api-key:latest" \
            --set-env-vars "^@^ENVIRONMENT=production@LOG_LEVEL=INFO@GCS_BUCKET_NAME=nextera-portfolio-energy-cache@GCS_ENABLED=true@REDIS_HOST=${{ secrets.REDIS_HOST }}@REDIS_PORT=6379@REQUIRE_REDIS=true@PRECOMPUTE_ENABLED=false@METRICS_ALLOWED_IPS=${{ secrets.METRICS_ALLOWED_IPS }}"

      # The scoring + training Cloud Run Jobs run from the same container image
      # but with different entrypoints. Cloud Scheduler invokes them on cron
      # (hourly scoring, daily training). See docs/SCHEDULED_JOBS.md for the
      # one-time setup of the scheduler entries and service-account IAM.
      - name: Deploy scoring job (Production)
        # PRECOMPUTE_MAX_WORKERS=8 on --cpu 4 / 8Gi (raised from 4 on 2 vCPU /
        # 4Gi, 2026-08-05). The three flags move together on purpose: 8 workers
        # on 2 vCPU turns a fetch-bound win into a compute-bound loss, because
        # models/xgboost_model.py bakes n_jobs=-1 into the persisted booster and
        # the predict threads already oversubscribe at 4; and 8 concurrent BAs
        # each holding a 90-day frame, multi-point weather (ADR-012), a booster
        # and a SHAP pass will OOM 4Gi — exit 137 is worse than a timeout, being
        # non-deterministic and able to land mid-write.
        #
        # Cost: doubling CPU+memory while halving runtime is BREAK-EVEN at Cloud
        # Run Jobs rates (us-east1: $0.000018/vCPU-s, $0.000002/GiB-s). You pay
        # only for the shortfall against a 2x speedup — roughly +$9/mo at the
        # expected -1/3, +$27/mo if concurrency buys nothing. Watch it: the jobs
        # already run ~$106/mo against a $150 budget, most of it the TRAINING
        # job, not this one.
        #
        # This is safe against EIA specifically because `eia_rate_limited` was
        # ZERO throughout the 2026-08-04 degradation — EIA was slow, not
        # throttling us. Under a 429 regime it would be the wrong lever, adding
        # load to something already refusing it. Check before raising further.
        #
        # task-timeout 1800 (30m): the run scores all 51 BAs with a cold
        # ephemeral cache each tick (full EIA + Open-Meteo fetch per BA).
        # Healthy runtime was ~830s at 4 workers and crept toward the old
        # 900s cap as features were added (ERA5 archive+forecast stitch #163,
        # drift stats PR-G9), until normal upstream-latency variance tipped it
        # over on 2026-06-01 and four consecutive ticks timed out (09:00–12:00
        # UTC, last_scored stale ~4.5h). Bumped 900→1800 for headroom. Per-BA
        # fetches are already parallelized (the 4-worker pool); #171 adds the
        # missing piece — a runtime-creep alert that warns on APPROACH before a
        # timeout (docs/monitoring/scoring_runtime_creep_alert.json). Keep
        # SCORING_TASK_TIMEOUT_S in config.py in lockstep with any --task-timeout
        # change here, or the alarm goes stale. Mirrors the training-job
        # 7200→18000 bump on 2026-05-03.
        #
        # DO NOT RAISE --task-timeout. This comment used to claim 1800s was
        # "well inside the hourly cadence so runs can't overlap". That was
        # wrong: the budget is task-timeout x (max-retries + 1), i.e.
        # 1800 x 2 = 3600s against a 3600s cadence — zero margin. On 2026-08-04
        # it went negative: an EIA partial degradation pushed the 19:00
        # execution to a timeout plus a 1792s retry that finished at 20:01,
        # AFTER the 20:00 execution had started. Two scoring processes ran at
        # once against a dependency that was failing because it was overloaded.
        # Raising the ceiling makes that overlap permanent rather than unlucky.
        # Reduce runtime instead (docs/SCHEDULED_JOBS.md runbook), or raise
        # PRECOMPUTE_MAX_WORKERS + --cpu, which costs no cadence margin.
        run: |
          gcloud run jobs deploy gridpulse-scoring-job \
            --image ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }} \
            --region ${{ env.REGION }} \
            --service-account "gridpulse-job@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --vpc-connector wattcast-connector \
            --set-secrets "EIA_API_KEY=eia-api-key:latest" \
            --set-env-vars "ENVIRONMENT=production,LOG_LEVEL=INFO,GCS_BUCKET_NAME=nextera-portfolio-energy-cache,GCS_ENABLED=true,REDIS_HOST=${{ secrets.REDIS_HOST }},REDIS_PORT=6379,PRECOMPUTE_MAX_WORKERS=8" \
            --command python \
            --args=-m,jobs,scoring \
            --task-timeout 1800 \
            --memory 8Gi \
            --cpu 4 \
            --max-retries 1

      - name: Deploy training job (Production)
        # task-timeout 18000 (5h): individual task budget.
        #
        # tasks 3, parallelism 3: each Cloud Run Job execution fans out
        # to three parallel tasks; ``jobs/training_job._partition_regions_for_task``
        # gives each task an interleaved-stride slice of the 51-BA list.
        # The 2026-05-06 manual run cleared 24 of 51 in 5h with one
        # task at ~12.5 min/BA average. 17 BAs per task × 12.5 min ≈
        # 3.5h, comfortably within the 5h budget.
        #
        # ``models.persistence._write_latest`` uses GCS optimistic
        # concurrency (If-Generation-Match) so concurrent pointer
        # updates from parallel tasks can't silently drop each
        # other's entries.
        #
        # max-retries 0: each retry restarts from BA 0 of THIS task
        # instead of resuming. The resume logic in training_job
        # (skip if data_hash matches) makes a *fresh execution* the
        # right path forward — let the next scheduled run pick up
        # where this one left off, don't waste a retry.
        #
        # memory 8Gi -> 4Gi (2026-08-05). MEASURED: peak container memory
        # utilization over 3 days is 0.155 of the 8Gi limit — 1.24 GiB. 4Gi
        # leaves it at ~31%, still 3x headroom. The 8Gi was never sized: it is
        # a restore-to-default (969dd7d, "peak training RSS is comfortably
        # under 4 GiB") after the 32Gi bump for an OOM whose actual cause —
        # 547 MB SARIMAX pickles — was fixed by the lean payload in
        # models/arima_model.py. Saves ~$6.6/mo of a ~$73/mo job.
        #
        # CPU stays at 4. Measured utilization is 0.66 mean / 0.82 peak of the
        # 4 vCPUs, i.e. ~2.6 cores genuinely busy — this is NOT over-provisioned
        # the way memory was, and cutting to 2 would cost real wall clock.
        # Break-even for --cpu 2 is a <100% slowdown, plausible but unproven;
        # measure a fixed 5-BA slice before trying it.
        #
        # Watch after this lands: if peak utilization approaches 1.0, an OOM
        # (exit 137) restarts the task from BA 0 because max-retries is 0 and
        # the resume is per-execution. Revert to 8Gi rather than debugging it.
        run: |
          gcloud run jobs deploy gridpulse-training-job \
            --image ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }} \
            --region ${{ env.REGION }} \
            --service-account "gridpulse-job@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --vpc-connector wattcast-connector \
            --set-secrets "EIA_API_KEY=eia-api-key:latest" \
            --set-env-vars "ENVIRONMENT=production,LOG_LEVEL=INFO,GCS_BUCKET_NAME=nextera-portfolio-energy-cache,GCS_ENABLED=true,REDIS_HOST=${{ secrets.REDIS_HOST }},REDIS_PORT=6379" \
            --command python \
            --args=-m,jobs,training \
            --task-timeout 18000 \
            --tasks 3 \
            --parallelism 3 \
            --memory 4Gi \
            --cpu 4 \
            --max-retries 0

      - name: Get production URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "### Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.DEPLOY_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**CI run:** [#${{ github.event.workflow_run.run_number }}](${{ github.event.workflow_run.html_url }})" >> $GITHUB_STEP_SUMMARY

      # Meaningful post-deploy smoke (PR-G3 / #147). Hits /health?deep=1
      # and applies deploy-scoped assertions:
      #   HARD FAIL when the fresh revision is not serving, or cannot
      #     reach Redis — both are deploy-config problems (broken image,
      #     wrong VPC connector, bad REDIS_HOST/secret).
      #   WARN ONLY when data is stale/empty (last_scored old, forecast
      #     sample empty) — those are NOT caused by the deploy; the next
      #     scoring tick fixes them and continuous monitoring (#150)
      #     alerts on them. Rolling back a good revision for a stale-data
      #     condition would be wrong.
      - name: Production health check
        run: |
          URL="${{ steps.url.outputs.url }}"
          echo "Probing $URL/health?deep=1 ..."
          BODY=""
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$URL/health?deep=1" || true)
            if [ "$CODE" = "200" ]; then
              echo "App is serving (HTTP 200)"
              BODY=$(cat /tmp/health.json)
              break
            fi
            echo "Attempt $i: HTTP $CODE - retrying in 15s..."
            sleep 15
          done

          if [ -z "$BODY" ]; then
            echo "::error::Production not serving — /health never returned 200"
            echo "ROLLBACK: gcloud run services update-traffic ${{ env.SERVICE }} --to-revisions=PREVIOUS=100 --region ${{ env.REGION }}"
            exit 1
          fi

          echo "$BODY" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(json.dumps(d, indent=2))
          status = d.get('status')
          checks = d.get('checks', {})
          redis = checks.get('redis', {})

          # HARD FAIL: fresh prod revision must reach Redis (deploy-config).
          if redis.get('status') == 'degraded':
              print('::error::Fresh revision cannot reach Redis — check VPC connector / REDIS_HOST / secret')
              sys.exit(1)

          # WARN-ONLY: stale/empty data is not deploy-caused.
          if status != 'healthy':
              degraded = {k: v for k, v in checks.items() if v.get('status') == 'degraded'}
              print(f'::warning::Deploy is serving + Redis reachable, but health is degraded (monitoring concern, not a deploy failure): {list(degraded)}')

          print('Deploy smoke passed: serving + Redis reachable.')
          " || exit 1

          {
            echo "**Post-deploy health:** \`$(echo "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')\`"
          } >> $GITHUB_STEP_SUMMARY
